# Ambiente Conda reprodutível do projeto (qml_dengue).
# Criar com:  conda env create -f environment.yml
#             conda activate qml_dengue
#
# NOTA IMPORTANTE (versões):
#   - O ESTUDO PRINCIPAL (modelos QML dos cenários C1/C2/C3) rodou em PennyLane 0.40.0.
#   - A EXECUÇÃO EM HARDWARE e o ESTUDO-SATÉLITE IMDC rodaram, posteriormente, em
#     PennyLane 0.42.3 + PennyLane-Qiskit 0.42.0 + Qiskit 1.2.4 (ver bloco comentado ao final).
#   As duas versões do PennyLane são incompatíveis no mesmo ambiente; use um ou outro.
name: qml_dengue
channels:
  - conda-forge
dependencies:
  - python=3.10.20
  - pip
  - pip:
      # --- Estudo principal (C1/C2/C3) ---
      - pennylane==0.40.0
      - numpy==1.26.4
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - matplotlib==3.10.9
      - xgboost==3.2.0
      - statsmodels==0.14.6
      - mlflow==3.14.0

# --- Ambiente de HARDWARE / ESTUDO-SATÉLITE IMDC (usar em substituição ao PennyLane acima) ---
#      - pennylane==0.42.3
#      - pennylane-qiskit==0.42.0
#      - qiskit==1.2.4
#      - qiskit-ibm-runtime==0.29.0
#      - qiskit-aer==0.16.0
